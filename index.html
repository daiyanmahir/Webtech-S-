<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donor Registration</title>

</head>
<body>

    <style>
        body{
            background-color: rgb(240, 209, 209);
            text-align: center;
        }
        div{
            display: inline-block;
            left: 100px;
            background-color: white;
            border:2px solid rgb(91, 1, 1);


        }
        table,td{
            padding: 10px;
        }
        span{
            color:red;
            font-size: 10px;;
        }
    </style>



    <h1 style="text-align: center; color:rgb(225, 59, 59)">Blood Donar Registration</h1>
    <div> 
        <form onabort="return validateForm()"  id="regForm "action="page2.html" method="post">
            <table >

                <tr>
                <td><label for="fname">Full Name</label></td>
                <td><input type="text" id="fname" required minlength="3"> <br>
                <span id="err-fname"></span></td>
                </tr>

                <tr>
                <td><label for="sid">AIUB ID</label></td>
                <td><input type="text"  id="sid" > <br>
                <span id="err-sid"></span></td>
                </tr>

                <tr>
                <td><label for="phone">Mobile</label></td>
                <td><input type="text"  id="aiubId" required minlength="11" maxlength="11">
                <span id="err-phone"></span></td>
                </tr>

                
                <tr>
                <td><label for="age">Age</label></td>
                <td><input type="number"  id="age" required min="18" max="60"> <br>
                <span id="err-age"></span></td>
                </tr>

                <tr>
                <td><label for="blood">Blood Group</label></td>
                <br>
                <td><select id="bgroup">
                    <option value="">Select blood group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <span id="err-bgroup"></span></td>
                </tr>

                 <tr>
                <td><label for="radio">Donated before?</label></td>
                <td>
                    <input  name="question" type="radio" id="donated-yes" value="yes" required>
                    <label for="yes">Yes</label>  

                    <input  name="question" type="radio"  id="donated-no" value="no" required>
                    <label for="no">No</label> 
                    <br>
                <span id="err-donated"></span>
                </td>
                </tr>
               
                <tr>
                    <td>
                        <input type="checkbox" id="agree">
                        <label for="check"> I am healthy and willing to donate</label>
                        <br>
                        <span id="err-agree"></span>
                    </td>
                </tr>

                <tr>
                <td><label for="pass">Password</label></td>
                <td><input type="password" id="pass" > <br>
                <span id="err-pass"></span></td>
                </tr>

                <tr>
                <td><label for="confirmpass">Confirm Password</label></td>
                <td><input type="password" id="pass2"> <br>
                <span id="err-pass2"></span></td>
                </tr>

                <tr>
                    <td> <button type="submit">Register Doner</button></td>
                </tr>

            </table>
        </form>

    </div>


    <script>
     let name=document.getElementById("fname").value;
     let id=document.getElementById("sid").value;
     let phone=document.getElementById("phone").value;
     let age=document.getElementById("age").value;
     let blood=document.getElementById("bgroup").value;
     let  yes=document.getElementById("donated-yes").value;
     let  no=document.getElementById("donated-no").value;
     let  agree=document.getElementById("agree").value;
     let  pass=document.getElementById("pass").value;
     let  pass2=document.getElementById("pass").value;

     let errname=document.getElementById("err-fname").value;
     let errid=document.getElementById("err-sid").value;
     let errphone=document.getElementById("err-phone").value;
     let errage=document.getElementById("err-age").value;
     let errbgroup=document.getElementById("err-bgroup").value;
     let  errdonated=document.getElementById("err-donated").value;
     let  erragree=document.getElementById("err-agree").value;
     let  errpass=document.getElementById("err-pass").value;
     let  errpass2=document.getElementById("err-pass").value;

     function validateForm(){
        if(name.trim()==="" || name.trim()===""){
         errname.innerHTML="Name must have at least 3 characters";
         return false;
        }
         if(phone.length!=11 || phone.indexOf("")!=-1){
            errphone.innerHTML="Mobile must be exactly 11 digits";
             return false;
         }
         if(age.length>60 || age.length<18){
            errage.innerHTML="Age must be between 18 and 60";
             return false;
         }
         if(blood==""){
            errbgroup.innerHTML="Select a blood group";
             return false;
         }
         if(!yes && !no){
            errdonated.innerHTML="Choose Yes or No";
             return false;
         }
         if(!agree){
            erragree.innerHTML="You must tick the box";
             return false;
         }
         if(pass.length<6 || pass==""){
           errpass.innerHTML="Password must be at least 6 characters";
            return false;
         }
         if(pass===pass2){
            errpass2.innerHTML="Password didn't match!";
            return false;
         }
         return true;



     }



    </script>
</body>
</html>
